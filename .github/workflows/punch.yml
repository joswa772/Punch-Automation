name: Daily Punch

on:
  schedule:
    - cron: '29 3 * * 1-6'   # 08:58 AM IST (Mon–Sat)
    - cron: '35 12 * * 1-6'  # 06:05 PM IST (Mon–Sat)
  workflow_dispatch:

jobs:
  run-punch:
    runs-on: ubuntu-latest

    env:
      SERVER: ${{ secrets.SERVER }}
      EMPCODE: ${{ secrets.EMPCODE }}
      PASSWORD: ${{ secrets.PASSWORD }}
      NORMAL_URL: ${{ secrets.NORMAL_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Firefox
        run: sudo apt update && sudo apt install -y firefox

      - name: Set timezone to IST
        run: sudo timedatectl set-timezone Asia/Kolkata

      - name: Run Normal Punch Script
        run: python punch_normal.py

      - name: Run Site Punch Script
        run: python punch_site.py

      - name: Upload Screenshots
        uses: actions/upload-artifact@v3
        with:
          name: punch-screenshots
          path: screenshots/
