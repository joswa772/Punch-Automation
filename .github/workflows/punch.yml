name: Daily Punch

on:
  schedule:
    # Converted IST to UTC
    - cron: '29 3 * * 1-6'   # 08:58 AM IST (Mon–Sat)
    - cron: '35 12 * * 1-6'  # 06:05 PM IST (Mon–Sat)
  workflow_dispatch:

jobs:
  run-punch:
    runs-on: ubuntu-latest

    env:
      SERVER: ${{ secrets.SERVER }}
      EMPCODE: ${{ secrets.EMPCODE }}
      PASSWORD: ${{ secrets.PASSWORD }}
      NORMAL_URL: ${{ secrets.NORMAL_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure logs/screenshots folders exist
        run: |
          mkdir -p screenshots
          mkdir -p logs

      - name: Install Firefox and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox libgtk-3-0 libdbus-glib-1-2 libxtst6 libx11-xcb1 libdbus-1-3

      - name: Verify Firefox installation
        run: |
          firefox --version
          geckodriver --version

      - name: Set timezone to IST
        run: sudo timedatectl set-timezone Asia/Kolkata

      - name: Run Normal Punch Script
        run: python -u punch_normal.py

      - name: Run Site Punch Script
        run: python -u punch_site.py

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v4
        with:
          name: punch-artifacts
          path: |
            screenshots/**
            logs/**
